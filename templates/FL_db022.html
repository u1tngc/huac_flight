<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUACフライト管理ツール 緊急課目履歴照会</title>
    <link rel="stylesheet" href="../static/FL1C0040.css">
</head>

<body>
    <header>
        <h1>フライト管理ツール</h1>
    </header>

    <main>
        <section class="options options-wide">
            <h2>緊急課目履歴照会</h2>
            <div class="student-info">
                <p><strong>氏名:</strong> {{ gakuseiName }}</p>
            </div>
            <form method="post" action="/FL_db022">
                <div class="history-list">
                    {% for list in rireki %}
                    <div class="history-card">
                        <div class="history-card-header">
                            <span class="history-date">{{ list[1] }}</span>
                            <span class="history-subject">{{ list[2] }}</span>
                        </div>
                        <div class="history-row">
                            <div class="history-label">教　官</div>
                            <div class="history-value">{{ list[3] }}</div>
                        </div>
                        <div class="history-row">
                            <div class="history-label">コメント</div>
                            <div class="history-value">{{ list[4] }}</div>
                        </div>
                    </div>
                    {% else %}
                    <p class="history-empty">該当する履歴データがありません。</p>
                    {% endfor %}
                </div>

                <div class="button-group">
                    <button type="button" onclick="location.href='/FL_db021'" class="menu-button">戻る</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Yuichi Taniguchi</p>
    </footer>
</body>

</html>
